# Runs on every merge request and on main. A red pipeline = not mergeable.
image: node:22

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

cache:
  key:
    files: [package-lock.json]
  paths: [.npm/]

stages: [check]

lint:
  stage: check
  script:
    - npm ci --cache .npm --prefer-offline
    - npm run lint

test:
  stage: check
  script:
    - npm ci --cache .npm --prefer-offline
    - npm test
